name: Release

# Publica os pacotes no npm quando uma tag de versão é enviada (ex.: v0.1.0).
# A autenticação é por trusted publishing (OIDC): não há token do npm no
# repositório. O provenance liga cada versão publicada a este workflow e commit.

on:
  push:
    tags: ['v*.*.*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC para o trusted publishing e o provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Sem cache no release, para não publicar nada vindo de um cache envenenado.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$(npm --version)" || npm install -g npm@11
          npm --version
      - run: pnpm install --frozen-lockfile
      - name: Check versions against the tag
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Pack
        # pnpm pack troca workspace:* pela versão real nas dependências.
        run: |
          mkdir -p release
          for pkg in core express fastify http; do
            (cd "packages/$pkg" && pnpm pack --pack-destination ../../release)
          done
          ls -l release
      - name: Publish
        # O core vai primeiro (os adapters dependem dele). Versão já publicada é
        # pulada, para que o workflow possa ser reexecutado depois de uma falha.
        run: |
          for pkg in core express fastify http; do
            name="$(node -p "require('./packages/$pkg/package.json').name")"
            version="$(node -p "require('./packages/$pkg/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version já está no npm, pulando"
              continue
            fi
            tarball="$(ls release/vigilo-$pkg-*.tgz)"
            npm publish "$tarball" --access public --provenance
          done
